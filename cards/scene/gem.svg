<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6ff2bd"/><stop offset=".45" stop-color="#19c48a"/><stop offset="1" stop-color="#05523a"/>
        </linearGradient>
        <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#19c48a"/><stop offset="1" stop-color="#032c20"/>
        </linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0b8a5e"/><stop offset="1" stop-color="#032c20"/>
        </linearGradient>
        <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#19c48a"/><stop offset=".55" stop-color="#0b8a5e"/><stop offset="1" stop-color="#05523a"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
      </defs>

      <!-- outline: octagon -->
      <!-- outer: (90,10)(310,10)(390,90)(390,370)(310,450)(90,450)(10,370)(10,90) -->
      <!-- mid:   (110,50)(290,50)(350,110)(350,350)(290,410)(110,410)(50,350)(50,110) -->
      <!-- table: (135,95)(265,95)(305,135)(305,325)(265,365)(135,365)(95,325)(95,135) -->
      <!-- outer ring facets -->
      <polygon points="90,10 310,10 290,50 110,50" fill="#6ff2bd"/>
      <polygon points="310,10 390,90 350,110 290,50" fill="url(#g1)"/>
      <polygon points="390,90 390,370 350,350 350,110" fill="url(#g2)"/>
      <polygon points="390,370 310,450 290,410 350,350" fill="#05523a"/>
      <polygon points="310,450 90,450 110,410 290,410" fill="#032c20"/>
      <polygon points="90,450 10,370 50,350 110,410" fill="#05523a"/>
      <polygon points="10,370 10,90 50,110 50,350" fill="url(#g3)"/>
      <polygon points="10,90 90,10 110,50 50,110" fill="#19c48a"/>
      <!-- mid ring facets -->
      <polygon points="110,50 290,50 265,95 135,95" fill="#19c48a"/>
      <polygon points="290,50 350,110 305,135 265,95" fill="#0b8a5e"/>
      <polygon points="350,110 350,350 305,325 305,135" fill="#0b8a5e"/>
      <polygon points="350,350 290,410 265,365 305,325" fill="#032c20"/>
      <polygon points="290,410 110,410 135,365 265,365" fill="#05523a"/>
      <polygon points="110,410 50,350 95,325 135,365" fill="#032c20"/>
      <polygon points="50,350 50,110 95,135 95,325" fill="#05523a"/>
      <polygon points="50,110 110,50 135,95 95,135" fill="#6ff2bd" opacity=".85"/>
      <!-- table -->
      <polygon points="135,95 265,95 305,135 305,325 265,365 135,365 95,325 95,135" fill="url(#table)"/>
      <!-- inner step lines on table -->
      <polygon points="150,120 250,120 280,150 280,310 250,340 150,340 120,310 120,150" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
      <!-- edges -->
      <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5">
        <polygon points="90,10 310,10 390,90 390,370 310,450 90,450 10,370 10,90"/>
        <polygon points="110,50 290,50 350,110 350,350 290,410 110,410 50,350 50,110"/>
        <polygon points="135,95 265,95 305,135 305,325 265,365 135,365 95,325 95,135"/>
        <path d="M90,10L110,50L135,95 M310,10L290,50L265,95 M390,90L350,110L305,135 M390,370L350,350L305,325 M310,450L290,410L265,365 M90,450L110,410L135,365 M10,370L50,350L95,325 M10,90L50,110L95,135"/>
      </g>
      <!-- highlight -->
      <polygon points="90,10 310,10 290,50 110,50 50,110 10,90" fill="url(#shine)"/>
      <polygon points="135,95 230,95 120,250 95,250 95,135" fill="#fff" opacity=".10"/>
</svg>