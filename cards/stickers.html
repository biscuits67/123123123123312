<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Emerald stickers</title>
<!-- Sticker pack with the mascot «Эмик», a living emerald. stickers.html?s=<id> draws one sticker.
     Render: node tools/render_stickers.js -> stickers/*.webp (512x512, transparent) -->
<style>
  *{margin:0;padding:0}
  html,body{width:512px;height:512px;overflow:hidden;background:transparent}
  body.preview{background:#17212b}
  svg{display:block}
  text{font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-style:italic}
</style>
</head>
<body>
<svg id="s" width="512" height="512" viewBox="0 0 512 512"></svg>
<script>
const C = { c1:'#6ff2bd', c2:'#19c48a', c3:'#0b8a5e', c4:'#05523a', c5:'#032c20', ink:'#04261b',
            gold1:'#fff1b8', gold2:'#e8c66a', gold3:'#b8913a', white:'#ffffff' };

const DEFS = `
<defs>
  <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C.c1}"/><stop offset=".45" stop-color="${C.c2}"/><stop offset="1" stop-color="${C.c4}"/></linearGradient>
  <linearGradient id="gB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.c2}"/><stop offset="1" stop-color="${C.c5}"/></linearGradient>
  <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.c3}"/><stop offset="1" stop-color="${C.c5}"/></linearGradient>
  <linearGradient id="tab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d197"/><stop offset=".55" stop-color="${C.c3}"/><stop offset="1" stop-color="${C.c4}"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.c3}"/><stop offset="1" stop-color="${C.c4}"/></linearGradient>
  <radialGradient id="hand" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${C.c1}"/><stop offset="1" stop-color="${C.c3}"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.gold1}"/><stop offset=".5" stop-color="${C.gold2}"/><stop offset="1" stop-color="${C.gold3}"/></linearGradient>
  <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9f7d9"/><stop offset="1" stop-color="#5fd6a2"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.c3}"/><stop offset=".55" stop-color="${C.c4}"/><stop offset="1" stop-color="${C.c5}"/></linearGradient>
  <linearGradient id="crown" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#e2fff3"/><stop offset=".45" stop-color="#a8ffd9"/><stop offset="1" stop-color="${C.c2}"/></linearGradient>
  <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="d"/>
    <feGaussianBlur in="d" stdDeviation="1.2" result="db"/>
    <feComponentTransfer in="db" result="dt"><feFuncA type="linear" slope="4" intercept="-1"/></feComponentTransfer>
    <feFlood flood-color="#fff"/><feComposite in2="dt" operator="in" result="white"/>
    <feGaussianBlur in="dt" stdDeviation="5" result="sb"/><feOffset in="sb" dy="4" result="so"/>
    <feFlood flood-color="#00140c" flood-opacity=".45"/><feComposite in2="so" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>`;

// ---------- the mascot: emerald-cut body (same stone as on the cards) ----------
function gemBody() {
  return `<g transform="translate(166,132) scale(.45)">
    <polygon points="90,10 310,10 290,50 110,50" fill="${C.c1}"/>
    <polygon points="310,10 390,90 350,110 290,50" fill="url(#gA)"/>
    <polygon points="390,90 390,370 350,350 350,110" fill="url(#gB)"/>
    <polygon points="390,370 310,450 290,410 350,350" fill="${C.c4}"/>
    <polygon points="310,450 90,450 110,410 290,410" fill="${C.c5}"/>
    <polygon points="90,450 10,370 50,350 110,410" fill="${C.c4}"/>
    <polygon points="10,370 10,90 50,110 50,350" fill="url(#gC)"/>
    <polygon points="10,90 90,10 110,50 50,110" fill="${C.c2}"/>
    <polygon points="110,50 290,50 265,95 135,95" fill="${C.c2}"/>
    <polygon points="290,50 350,110 305,135 265,95" fill="${C.c3}"/>
    <polygon points="350,110 350,350 305,325 305,135" fill="${C.c3}"/>
    <polygon points="350,350 290,410 265,365 305,325" fill="${C.c5}"/>
    <polygon points="290,410 110,410 135,365 265,365" fill="${C.c4}"/>
    <polygon points="110,410 50,350 95,325 135,365" fill="${C.c5}"/>
    <polygon points="50,350 50,110 95,135 95,325" fill="${C.c4}"/>
    <polygon points="50,110 110,50 135,95 95,135" fill="${C.c1}" opacity=".85"/>
    <polygon points="135,95 265,95 305,135 305,325 265,365 135,365 95,325 95,135" fill="url(#tab)"/>
    <g fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2.5">
      <polygon points="90,10 310,10 390,90 390,370 310,450 90,450 10,370 10,90"/>
      <polygon points="135,95 265,95 305,135 305,325 265,365 135,365 95,325 95,135"/>
      <path d="M90,10L110,50L135,95 M310,10L290,50L265,95 M390,90L350,110L305,135 M390,370L350,350L305,325 M310,450L290,410L265,365 M90,450L110,410L135,365 M10,370L50,350L95,325 M10,90L50,110L95,135"/>
    </g>
    <polygon points="90,10 310,10 290,50 110,50 50,110 10,90" fill="url(#shine)"/>
    <polygon points="135,95 220,95 105,240 95,240 95,135" fill="#fff" opacity=".12"/>
    <polygon points="90,10 310,10 390,90 390,370 310,450 90,450 10,370 10,90" fill="none" stroke="${C.c5}" stroke-width="7"/>
  </g>`;
}
// body spans x 166..346, y 132..339; face centre ~ (256,236)

// ---------- face parts ----------
const EYE_L = [228, 226], EYE_R = [284, 226];
function eyes(kind) {
  const open = (x, y, px = 0, py = 0, r = 17) => `
    <ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 1.15}" fill="#fff" stroke="${C.ink}" stroke-width="4"/>
    <circle cx="${x + px}" cy="${y + py + 2}" r="${r * .55}" fill="${C.ink}"/>
    <circle cx="${x + px - r * .2}" cy="${y + py - r * .15}" r="${r * .2}" fill="#fff"/>`;
  const arc = (x, y, up = true) => `<path d="M${x - 14},${y + (up ? 4 : -4)} Q${x},${y + (up ? -12 : 12)} ${x + 14},${y + (up ? 4 : -4)}"
    fill="none" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`;
  const heart = (x, y, s = 1) => `<path transform="translate(${x},${y}) scale(${s})" d="M0,10 C-22,-6 -14,-22 0,-12 C14,-22 22,-6 0,10 Z" fill="#ff5b7a" stroke="${C.ink}" stroke-width="3.5"/>`;
  const dollar = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="18" ry="20" fill="${C.gold2}" stroke="${C.ink}" stroke-width="4"/>
    <text x="${x}" y="${y + 9}" text-anchor="middle" font-size="27" fill="${C.ink}" style="font-style:normal">$</text>`;
  const [lx, ly] = EYE_L, [rx, ry] = EYE_R;
  switch (kind) {
    case 'wide': return open(lx, ly, 0, -2, 21) + open(rx, ry, 0, -2, 21);
    case 'happy': return arc(lx, ly + 2) + arc(rx, ry + 2);
    case 'wink': return open(lx, ly) + arc(rx, ry + 2);
    case 'sad': return open(lx, ly + 2, 0, 4) + open(rx, ry + 2, 0, 4);
    case 'closed': return arc(lx, ly, false) + arc(rx, ry, false);
    case 'side': return open(lx, ly, 6, 0) + open(rx, ry, 6, 0);
    case 'up': return open(lx, ly, 3, -6) + open(rx, ry, 3, -6);
    case 'hearts': return heart(lx, ly, 1.25) + heart(rx, ry, 1.25);
    case 'dollar': return dollar(lx, ly) + dollar(rx, ry);
    case 'shades': return `<path d="M200,212 H312 L308,228 Q304,246 284,246 Q266,246 262,230 L258,222 H254 L250,230 Q246,246 228,246 Q208,246 204,228 Z"
      fill="#0b0f0e" stroke="${C.ink}" stroke-width="3"/><path d="M212,218 L226,218 M268,218 L282,218" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>`;
    case 'angry': return open(lx, ly + 3, 2, 2, 15) + open(rx, ry + 3, -2, 2, 15);
    case 'dizzy': return [EYE_L, EYE_R].map(([x, y]) => `<path d="M${x - 11},${y - 11} L${x + 11},${y + 11} M${x + 11},${y - 11} L${x - 11},${y + 11}" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`).join('');
    default: return open(lx, ly) + open(rx, ry);
  }
}
function brows(kind) {
  const b = (x1, y1, x2, y2) => `<path d="M${x1},${y1} L${x2},${y2}" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`;
  switch (kind) {
    case 'up': return b(214, 196, 240, 190) + b(272, 190, 298, 196);
    case 'angry': return b(212, 198, 242, 208) + b(270, 208, 300, 198);
    case 'sad': return b(214, 204, 240, 196) + b(272, 196, 298, 204);
    default: return '';
  }
}
function mouth(kind) {
  const ink = `stroke="${C.ink}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
  switch (kind) {
    case 'smile': return `<path d="M236,264 Q256,282 276,264" fill="none" ${ink}/>`;
    case 'grin': return `<path d="M230,260 Q256,262 282,260 Q280,292 256,292 Q232,292 230,260 Z" fill="#7a1430" ${ink}/>
      <path d="M234,262 H278 L276,270 H236 Z" fill="#fff"/><path d="M244,286 Q256,280 268,286" fill="#ff7c93"/>`;
    case 'open': return `<ellipse cx="256" cy="276" rx="16" ry="21" fill="#7a1430" ${ink}/><ellipse cx="256" cy="288" rx="9" ry="6" fill="#ff7c93"/>`;
    case 'o': return `<ellipse cx="256" cy="272" rx="9" ry="11" fill="#7a1430" ${ink}/>`;
    case 'sad': return `<path d="M238,280 Q256,264 274,280" fill="none" ${ink}/>`;
    case 'cry': return `<path d="M232,286 Q256,256 280,286 Q256,278 232,286 Z" fill="#7a1430" ${ink}/>`;
    case 'flat': return `<path d="M240,272 H272" fill="none" ${ink}/>`;
    case 'smirk': return `<path d="M238,270 Q262,276 278,262" fill="none" ${ink}/>`;
    case 'tongue': return `<path d="M234,262 Q256,284 278,262 Z" fill="#7a1430" ${ink}/><path d="M248,272 Q256,292 266,272 Z" fill="#ff7c93" ${ink}/>`;
    case 'teeth': return `<rect x="232" y="262" width="48" height="20" rx="8" fill="#fff" ${ink}/><path d="M232,272 H280 M248,262 V282 M264,262 V282" stroke="${C.ink}" stroke-width="3"/>`;
    case 'wavy': return `<path d="M234,274 Q240,266 246,274 T258,274 T270,274 T282,274" fill="none" ${ink}/>`;
    default: return `<path d="M240,266 Q256,278 272,266" fill="none" ${ink}/>`;
  }
}
const blush = () => `<ellipse cx="212" cy="254" rx="10" ry="6" fill="#ff6f93" opacity=".8"/><ellipse cx="300" cy="254" rx="10" ry="6" fill="#ff6f93" opacity=".8"/>`;

// ---------- limbs ----------
function limb(d, w = 15) {
  return `<path d="${d}" fill="none" stroke="${C.c5}" stroke-width="${w + 8}" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${d}" fill="none" stroke="url(#limb)" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
const handBall = (x, y, r = 15) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#hand)" stroke="${C.c5}" stroke-width="5"/>`;
const thumb = (x, y, flip = 1) => `<g transform="translate(${x},${y}) scale(${flip},1)">
  <rect x="-15" y="-10" width="30" height="26" rx="10" fill="url(#hand)" stroke="${C.c5}" stroke-width="5"/>
  <rect x="-9" y="-34" width="13" height="30" rx="6.5" fill="url(#hand)" stroke="${C.c5}" stroke-width="5"/></g>`;
const ARMS = {   // shoulders ~ (172,250) and (340,250)
  down: () => limb('M174,252 Q150,280 156,306') + handBall(156, 308) + limb('M338,252 Q362,280 356,306') + handBall(356, 308),
  up: () => limb('M176,240 Q140,200 132,160') + handBall(132, 156) + limb('M336,240 Q372,200 380,160') + handBall(380, 156),
  cheeks: () => limb('M176,252 Q150,262 196,262') + handBall(200, 262, 16) + limb('M336,252 Q362,262 316,262') + handBall(312, 262, 16),
  thumbs: () => limb('M174,252 Q150,280 156,306') + handBall(156, 308) + limb('M338,248 Q372,236 380,200') + thumb(382, 196),
  thumbsBoth: () => limb('M174,248 Q140,236 132,200') + thumb(130, 196, -1) + limb('M338,248 Q372,236 380,200') + thumb(382, 196),
  holdR: () => limb('M174,252 Q150,280 156,306') + handBall(156, 308) + limb('M338,252 Q372,262 384,236') + handBall(386, 232),
  holdBoth: () => limb('M176,256 Q170,292 214,300') + handBall(218, 300) + limb('M336,256 Q342,292 298,300') + handBall(294, 300),
  face: () => limb('M174,252 Q150,280 156,306') + handBall(156, 308) + limb('M338,258 Q344,306 300,306') + handBall(296, 304, 16),
  wave: () => limb('M174,252 Q150,280 156,306') + handBall(156, 308) + limb('M338,244 Q378,226 384,180') + handBall(386, 174, 16),
  heart: () => limb('M176,256 Q190,300 236,306') + limb('M336,256 Q322,300 276,306'),
  hips: () => limb('M174,252 Q140,272 168,300') + handBall(170, 300) + limb('M338,252 Q372,272 344,300') + handBall(342, 300),
  salute: () => limb('M174,252 Q150,280 156,306') + handBall(156, 308) + limb('M338,248 Q350,200 316,190') + handBall(312, 190),
};
const legs = (spread = 0) => limb(`M228,336 L${224 - spread},372`, 16) + limb(`M284,336 L${288 + spread},372`, 16) +
  `<ellipse cx="${216 - spread}" cy="378" rx="22" ry="12" fill="${C.c5}"/><ellipse cx="${296 + spread}" cy="378" rx="22" ry="12" fill="${C.c5}"/>
   <ellipse cx="${210 - spread}" cy="374" rx="8" ry="4" fill="#fff" opacity=".25"/><ellipse cx="${290 + spread}" cy="374" rx="8" ry="4" fill="#fff" opacity=".25"/>`;

// ---------- props ----------
const sparkle = (x, y, s = 1, c = '#fff') => `<path transform="translate(${x},${y}) scale(${s})" d="M0,-20 Q3,-3 20,0 Q3,3 0,20 Q-3,3 -20,0 Q-3,-3 0,-20 Z" fill="${c}" stroke="${C.c4}" stroke-width="2.5"/>`;
const bill = (x, y, r = 0, s = 1) => `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})">
  <rect x="-36" y="-20" width="72" height="40" rx="5" fill="url(#bill)" stroke="${C.c4}" stroke-width="4"/>
  <rect x="-29" y="-13" width="58" height="26" rx="3" fill="none" stroke="${C.c3}" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="10" fill="${C.c2}" stroke="${C.c4}" stroke-width="2.5"/>
  <text x="0" y="6" text-anchor="middle" font-size="15" fill="#fff" style="font-style:normal">$</text></g>`;
const coin = (x, y, r = 16) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gold)" stroke="${C.gold3}" stroke-width="3.5"/>
  <circle cx="${x}" cy="${y}" r="${r * .66}" fill="none" stroke="${C.gold3}" stroke-width="2.5"/>
  <text x="${x}" y="${y + r * .38}" text-anchor="middle" font-size="${r * 1.05}" fill="${C.gold3}" style="font-style:normal">$</text>`;
const tear = (x, y, s = 1) => `<path transform="translate(${x},${y}) scale(${s})" d="M0,-12 Q10,4 0,10 Q-10,4 0,-12 Z" fill="#8fe6ff" stroke="${C.ink}" stroke-width="2.5"/>`;
const stream = (x, dir) => `<path d="M${x},242 Q${x + dir * 8},280 ${x + dir * 30},300 Q${x + dir * 18},318 ${x + dir * 44},336"
  fill="none" stroke="#8fe6ff" stroke-width="12" stroke-linecap="round" opacity=".95"/>`;
const sweat = (x, y) => `<path d="M${x},${y - 16} Q${x + 12},${y + 2} ${x},${y + 10} Q${x - 12},${y + 2} ${x},${y - 16} Z" fill="#a9ecff" stroke="${C.ink}" stroke-width="3"/>`;
const crown = (x, y, s = 1, r = 0) => `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})">
  <path d="M-35,22 L-40,-14 L-18,4 L0,-26 L18,4 L40,-14 L35,22 Z" fill="none" stroke="${C.c5}" stroke-width="17" stroke-linejoin="round" transform="translate(0,3)"/>
  <path d="M-35,22 L-40,-14 L-18,4 L0,-26 L18,4 L40,-14 L35,22 Z" fill="none" stroke="url(#crown)" stroke-width="11" stroke-linejoin="round"/></g>`;
const hardhat = () => `<g><path d="M188,150 Q190,96 256,94 Q322,96 324,150 Z" fill="url(#gold)" stroke="${C.ink}" stroke-width="5"/>
  <path d="M244,96 H268 V150 H244 Z" fill="${C.gold1}" stroke="${C.ink}" stroke-width="4"/>
  <rect x="172" y="146" width="168" height="16" rx="8" fill="${C.gold2}" stroke="${C.ink}" stroke-width="5"/></g>`;
const wrench = (x, y, r) => `<g transform="translate(${x},${y}) rotate(${r})"><rect x="-7" y="-10" width="14" height="70" rx="6" fill="#c9d6d0" stroke="${C.ink}" stroke-width="4"/>
  <path d="M-20,-30 Q-22,-10 0,-8 Q22,-10 20,-30 L10,-30 L8,-18 H-8 L-10,-30 Z" fill="#c9d6d0" stroke="${C.ink}" stroke-width="4"/></g>`;
const factory = () => `<g opacity=".95" transform="translate(0,22)"><path d="M60,160 V96 L96,116 V96 L132,116 V70 H150 V160 Z" fill="#9fb3aa" stroke="${C.ink}" stroke-width="4"/>
  <rect x="74" y="128" width="14" height="14" fill="${C.gold2}" stroke="${C.ink}" stroke-width="3"/><rect x="104" y="128" width="14" height="14" fill="${C.gold2}" stroke="${C.ink}" stroke-width="3"/>
  <circle cx="148" cy="54" r="10" fill="#cfd8d4" stroke="${C.ink}" stroke-width="3"/><circle cx="164" cy="38" r="13" fill="#cfd8d4" stroke="${C.ink}" stroke-width="3"/></g>`;
const rocket = () => `<g transform="translate(256,372) rotate(-12)">
  <path d="M-112,0 Q-70,-30 90,-22 Q132,-12 136,0 Q132,12 90,22 Q-70,30 -112,0 Z" fill="#e9f5f0" stroke="${C.ink}" stroke-width="5"/>
  <path d="M90,-22 Q132,-12 136,0 Q132,12 90,22 Z" fill="#ff5b7a" stroke="${C.ink}" stroke-width="5"/>
  <path d="M-80,-16 L-110,-48 L-60,-20 Z M-80,16 L-110,48 L-60,20 Z" fill="#ff5b7a" stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="40" cy="0" r="11" fill="${C.c1}" stroke="${C.ink}" stroke-width="4"/>
  <path d="M-112,0 L-170,-20 L-150,0 L-176,18 Z" fill="${C.gold2}" stroke="${C.ink}" stroke-width="4" stroke-linejoin="round"/></g>`;
const cup = () => `<g transform="translate(386,268)"><path d="M-24,-26 H24 L20,22 Q18,30 10,30 H-10 Q-18,30 -20,22 Z" fill="#fff" stroke="${C.ink}" stroke-width="5"/>
  <path d="M22,-14 Q42,-14 40,4 Q38,16 20,14" fill="none" stroke="${C.ink}" stroke-width="5"/>
  <rect x="-24" y="-8" width="46" height="14" fill="${C.c2}"/><path d="M-8,-40 Q-14,-50 -8,-60 M8,-40 Q2,-50 8,-60" stroke="#b8c7c1" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;
const phone = () => `<g transform="translate(390,226) rotate(14)"><rect x="-22" y="-40" width="44" height="80" rx="9" fill="#0d1714" stroke="${C.ink}" stroke-width="4"/>
  <rect x="-16" y="-32" width="32" height="60" rx="4" fill="${C.c2}"/><path d="M-8,4 L-2,12 L10,-6" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
const hourglass = () => `<g transform="translate(110,190) rotate(-10)"><rect x="-28" y="-46" width="56" height="10" rx="4" fill="url(#gold)" stroke="${C.ink}" stroke-width="4"/>
  <rect x="-28" y="36" width="56" height="10" rx="4" fill="url(#gold)" stroke="${C.ink}" stroke-width="4"/>
  <path d="M-20,-36 Q-20,-8 0,0 Q-20,8 -20,36 H20 Q20,8 0,0 Q20,-8 20,-36 Z" fill="#e9f5f0" stroke="${C.ink}" stroke-width="4"/>
  <path d="M-12,-26 H12 Q10,-12 0,-4 Q-10,-12 -12,-26 Z M-14,32 Q0,14 14,32 Z" fill="${C.c2}"/></g>`;
const bag = () => `<g transform="translate(382,236)"><path d="M-30,-16 Q-44,40 0,44 Q44,40 30,-16 Q14,-28 0,-26 Q-14,-28 -30,-16 Z" fill="url(#gold)" stroke="${C.ink}" stroke-width="5"/>
  <path d="M-14,-26 L-20,-42 Q0,-36 20,-42 L14,-26" fill="${C.gold2}" stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"/>
  <text x="0" y="22" text-anchor="middle" font-size="34" fill="${C.gold3}" style="font-style:normal">$</text></g>`;
const steam = () => `<g fill="#e9f5f0" stroke="${C.ink}" stroke-width="4"><path d="M150,140 q-16,-16 0,-30 q16,-14 2,-30"/><path d="M362,140 q16,-16 0,-30 q-16,-14 -2,-30"/></g>`;
const qmark = (x, y, s, r) => `<text transform="translate(${x},${y}) rotate(${r}) scale(${s})" text-anchor="middle" font-size="64" fill="${C.c2}" stroke="${C.ink}" stroke-width="4" paint-order="stroke" style="font-style:normal">?</text>`;
const confetti = () => [[90, 110, '#ff5b7a', 20], [420, 96, C.gold2, -30], [70, 250, C.c1, 40], [446, 240, '#8fe6ff', -10], [130, 60, C.c2, 60],
  [380, 50, '#ff5b7a', 15], [452, 330, C.gold2, 50], [60, 340, '#8fe6ff', -40]].map(([x, y, c, r]) =>
  `<rect x="${x - 7}" y="${y - 12}" width="14" height="24" rx="3" fill="${c}" stroke="${C.ink}" stroke-width="3" transform="rotate(${r} ${x} ${y})"/>`).join('');
const heartBig = () => `<path transform="translate(256,300) scale(1.5)" d="M0,18 C-38,-8 -24,-36 0,-18 C24,-36 38,-8 0,18 Z" fill="#ff5b7a" stroke="${C.ink}" stroke-width="3.5"/>`;
const zzz = () => `<g fill="${C.c1}" stroke="${C.ink}" stroke-width="3" paint-order="stroke" style="font-style:normal">
  <text x="346" y="158" font-size="40">z</text><text x="374" y="124" font-size="52">z</text><text x="408" y="84" font-size="64">Z</text></g>`;
const bulb = () => `<g transform="translate(256,92)"><circle r="30" fill="${C.gold1}" stroke="${C.ink}" stroke-width="5"/><rect x="-14" y="26" width="28" height="18" rx="4" fill="#b8c7c1" stroke="${C.ink}" stroke-width="4"/>
  <path d="M-48,-30 L-38,-22 M48,-30 L38,-22 M0,-52 V-40 M-56,4 H-42 M56,4 H42" stroke="${C.gold2}" stroke-width="6" stroke-linecap="round"/></g>`;
const chart = () => `<g transform="translate(96,206)"><rect x="-40" y="-56" width="80" height="96" rx="10" fill="#fff" stroke="${C.ink}" stroke-width="5"/>
  <path d="M-26,24 L-8,4 L6,14 L28,-26" fill="none" stroke="${C.c2}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14,-28 L30,-30 L28,-14" fill="none" stroke="${C.c2}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>`;

// ---------- caption ----------
function caption(lines, size = 68) {
  const n = lines.length, lh = size * 0.98, y0 = 478 - (n - 1) * lh;
  return lines.map((t, i) => `<text x="256" y="${y0 + i * lh}" text-anchor="middle" font-size="${size}" letter-spacing="-1"
    fill="url(#txt)" stroke="${C.c5}" stroke-width="3" paint-order="stroke" transform="rotate(-4 256 ${y0 + i * lh})">${t}</text>`).join('');
}

// ---------- stickers ----------
// each: emoji (for Telegram), caption lines, and the parts of Эмик
const S = {
  wow:      { e: '😮', cap: ['ВАУ!'], eyes: 'wide', brows: 'up', mouth: 'open', arms: 'cheeks', back: () => sparkle(110, 120, 1.4) + sparkle(404, 110, 1.1) + sparkle(420, 300, .9) },
  money:    { e: '🤑', cap: ['ДЕНЬГИ!'], eyes: 'dollar', mouth: 'grin', arms: 'up', blush: true,
              back: () => bill(110, 110, -24) + bill(400, 96, 20) + bill(70, 250, 12, .9) + bill(444, 236, -16, .9) + coin(168, 64) + coin(352, 52, 14),
              front: () => bill(132, 150, -10, .85) + bill(384, 150, 14, .85) },
  super:    { e: '👍', cap: ['СУПЕР!'], eyes: 'wink', mouth: 'grin', arms: 'thumbsBoth', blush: true, back: () => sparkle(256, 84, 1.3) + sparkle(96, 300, .8) + sparkle(420, 300, .8) },
  factory:  { e: '😭', cap: ['ПОЙДУ', 'НА ЗАВОД'], size: 62, eyes: 'sad', brows: 'sad', mouth: 'sad', arms: 'holdR', hat: true,
              back: () => factory(), front: () => wrench(388, 230, 30) + tear(208, 262) },
  zanos:    { e: '🎉', cap: ['ЗАНОС!'], eyes: 'happy', mouth: 'grin', arms: 'up', blush: true, back: () => confetti() + sparkle(256, 70, 1.2) },
  rocket:   { e: '🚀', cap: ['ЛЕТИМ!'], eyes: 'shades', mouth: 'grin', arms: 'up', noLegs: true, front: () => rocket(), back: () => sparkle(96, 110, 1) + sparkle(420, 90, 1.2) },
  depnul:   { e: '💸', cap: ['ДЕПНУЛ!'], eyes: 'happy', mouth: 'smirk', arms: 'holdR', blush: true, front: () => phone(), back: () => coin(110, 120, 20) + coin(150, 70, 14) + sparkle(420, 110, 1) },
  payout:   { e: '⏳', cap: ['ЖДУ', 'ВЫПЛАТУ'], size: 62, eyes: 'side', mouth: 'flat', arms: 'hips', back: () => hourglass(), front: () => sweat(318, 196) },
  king:     { e: '😎', cap: ['КРАСАВА!'], eyes: 'shades', mouth: 'smirk', arms: 'thumbs', crown: true, back: () => sparkle(110, 110, 1.2) + sparkle(420, 300, .9) + sparkle(96, 300, .7) },
  thanks:   { e: '🥰', cap: ['СПАСИБО!'], eyes: 'hearts', mouth: 'smile', arms: 'heart', blush: true, front: () => heartBig(), back: () => sparkle(110, 120, 1) + sparkle(404, 110, 1) },
  cry:      { e: '😭', cap: ['ПЛАЧУ'], eyes: 'closed', brows: 'sad', mouth: 'cry', arms: 'down', front: () => stream(212, -1) + stream(300, 1) },
  what:     { e: '🤨', cap: ['ЧЕГО?!'], eyes: 'side', brows: 'angry', mouth: 'wavy', arms: 'face', back: () => qmark(110, 150, 1.3, -14) + qmark(410, 120, 1, 16) + qmark(430, 250, .7, 10) },
  morning:  { e: '☕', cap: ['ДОБРОЕ', 'УТРО'], size: 62, eyes: 'closed', mouth: 'smile', arms: 'holdR', blush: true, front: () => cup(), back: () => sparkle(110, 110, .9) },
  angry:    { e: '😡', cap: ['БЕСИТ!'], eyes: 'angry', brows: 'angry', mouth: 'teeth', arms: 'hips', back: () => steam() },
  sleep:    { e: '😴', cap: ['ЛЕГ', 'СПАТЬ'], size: 62, eyes: 'closed', mouth: 'o', arms: 'down', back: () => zzz() },
  idea:     { e: '💡', cap: ['ЕСТЬ ИДЕЯ!'], size: 62, eyes: 'up', brows: 'up', mouth: 'smile', arms: 'wave', back: () => bulb() },
  profit:   { e: '📈', cap: ['ПРОФИТ!'], eyes: 'wink', mouth: 'tongue', arms: 'holdR', blush: true, front: () => bag(), back: () => chart() },
  ok:       { e: '🫡', cap: ['ПРИНЯЛ!'], eyes: 'normal', mouth: 'smile', arms: 'salute', back: () => sparkle(110, 120, .9) + sparkle(410, 300, .8) },
  dizzy:    { e: '😵', cap: ['МИНУС...'], eyes: 'dizzy', mouth: 'wavy', arms: 'down', front: () => sweat(320, 200), back: () => sparkle(120, 120, .8, '#ff8fa8') + sparkle(400, 110, .8, '#ff8fa8') },
  hi:       { e: '👋', cap: ['ПРИВЕТ!'], eyes: 'happy', mouth: 'grin', arms: 'wave', blush: true, back: () => sparkle(110, 120, 1) + sparkle(96, 300, .7) },
};

function draw(id) {
  const s = S[id];
  // the face is drawn a little larger than the stone's table so it reads at sticker size
  const face = `<g transform="translate(256,248) scale(1.16) translate(-256,-248)">${eyes(s.eyes)}${brows(s.brows || '')}${mouth(s.mouth)}${s.blush ? blush() : ''}</g>`;
  const arms = (ARMS[s.arms] || ARMS.down)();
  const inFront = ['cheeks', 'face', 'salute'].includes(s.arms);   // poses where the hands cross the stone
  const art = `
    ${s.back ? s.back() : ''}
    ${s.noLegs ? '' : legs()}
    ${inFront ? '' : arms}
    ${gemBody()}
    ${face}
    ${inFront ? arms : ''}
    ${s.hat ? hardhat() : ''}
    ${s.crown ? crown(256, 112, 1.25, -8) : ''}
    ${s.front ? s.front() : ''}`;
  // the mascot fills the sticker; the caption overlaps its feet, like classic sticker packs
  return `${DEFS}<g filter="url(#outline)">
    <g transform="translate(256,0) scale(1.04) translate(-256,-30)">${art}</g>
    ${caption(s.cap, s.size || 68)}
  </g>`;
}

const q = new URLSearchParams(location.search);
if (q.has('preview')) document.body.classList.add('preview');
document.getElementById('s').innerHTML = draw(S[q.get('s')] ? q.get('s') : 'wow');
window.__stickers = Object.fromEntries(Object.entries(S).map(([k, v]) => [k, v.e]));
</script>
